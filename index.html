<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>T-CITY ADMIN</title>
<style>
*{box-sizing:border-box}
:root{
  font-family:Arial,Helvetica,sans-serif;
  background:#000;color:#ececec;
  --line:#252525;--line2:#343434;--muted:#666;--muted2:#888;--panel:#070707;
}
html,body{margin:0;width:100%;height:100%;background:#000}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0;background:#000;color:#ececec;overflow:hidden}
.topbar{
  position:absolute;left:0;right:0;top:0;height:calc(64px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 18px 0;
  display:grid;grid-template-columns:46px 1fr 46px;align-items:center;
  border-bottom:1px solid var(--line);background:#000;z-index:30;
}
.topbar button{
  width:42px;height:42px;border:0;background:transparent;color:#aaa;
  display:grid;place-items:center;font-size:23px;padding:0;
}
.top-title{text-align:center}
.top-title strong{display:block;font-size:12px;font-weight:500;letter-spacing:.13em}
.top-title span{display:block;margin-top:3px;color:#494949;font-size:8px;letter-spacing:.12em}
.bell-wrap{position:relative}
.bell-dot{
  position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#d74242;
}
.view{
  position:absolute;left:0;right:0;
  top:calc(64px + env(safe-area-inset-top));
  bottom:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:22px 18px calc(34px + env(safe-area-inset-bottom));
}
.eyebrow{font-size:8px;color:#555;letter-spacing:.14em;text-transform:uppercase}
.h1{font-size:30px;line-height:1.02;font-weight:400;letter-spacing:-.035em;margin:8px 0 0}
.lead{font-size:11px;line-height:1.55;color:#6d6d6d;margin:10px 0 0;max-width:520px}
.rule{border-top:1px solid var(--line);margin:22px 0}
.section-title{font-size:9px;color:#5f5f5f;letter-spacing:.12em;margin:0 0 10px;text-transform:uppercase}
.nav-list{border-top:1px solid var(--line);margin-top:22px}
.nav-row{
  width:100%;min-height:72px;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:#d4d4d4;text-align:left;
  display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:0 2px;
}
.nav-icon{font-size:18px;color:#777;text-align:center}
.nav-copy strong{display:block;font-size:14px;font-weight:400}
.nav-copy span{display:block;margin-top:5px;color:#575757;font-size:9px;line-height:1.4}
.arrow{color:#444;font-size:17px}
.metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px;
}
.metric{border:1px solid var(--line);background:#030303;padding:14px;min-height:84px}
.metric strong{display:block;font-size:24px;font-weight:400;letter-spacing:-.04em}
.metric span{display:block;color:#5b5b5b;font-size:8px;letter-spacing:.08em;margin-top:8px;text-transform:uppercase}
.today-list,.client-list,.notice-list,.chat-list,.transaction-list{border-top:1px solid var(--line)}
.booking-row,.client-row,.notice-row,.chat-row,.transaction-row{
  width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:#d1d1d1;
  text-align:left;padding:15px 2px;display:block;
}
.booking-row-top,.client-row-top,.notice-row-top,.chat-row-top,.transaction-row-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px
}
.booking-row strong,.client-row strong,.chat-row strong{font-weight:400;font-size:14px}
.booking-time{font-size:18px;letter-spacing:-.02em;min-width:54px}
.booking-meta,.client-meta,.notice-meta,.chat-meta,.transaction-meta{
  margin-top:6px;color:#606060;font-size:9px;line-height:1.5
}
.status{
  display:inline-block;border:1px solid #313131;color:#737373;padding:4px 6px;
  font-size:7px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.status.work{color:#aaa;border-color:#454545}
.status.ready{color:#d5d5d5;border-color:#686868}
.empty{border:1px solid var(--line);padding:20px;color:#535353;font-size:11px;line-height:1.5;text-align:center}
.action{
  width:100%;min-height:48px;border:1px solid #303030;background:#050505;color:#bdbdbd;
  margin-top:10px;padding:0 14px;
}
.action.primary{background:#e6e6e6;color:#090909;border-color:#e6e6e6}
.action.danger{color:#c76767;border-color:#4b2929;background:#090303}
.action.small{width:auto;min-height:36px;margin:0;padding:0 12px;font-size:9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.field{margin-top:14px}
.field label{display:block;color:#595959;font-size:8px;letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase}
.field input,.field textarea,.field select{
  width:100%;border:1px solid #2b2b2b;background:#050505;color:#d0d0d0;outline:none;
  border-radius:0;padding:12px;min-height:44px;
}
.field textarea{min-height:104px;resize:vertical;line-height:1.5}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);background:#030303;padding:14px;margin-top:10px}
.kv{border-top:1px solid var(--line)}
.kv-row{display:grid;grid-template-columns:42% 1fr;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}
.kv-row span:first-child{color:#5d5d5d;font-size:9px}
.kv-row span:last-child{color:#bdbdbd;font-size:10px;text-align:right;word-break:break-word}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;margin:18px 0 0}
.tab{
  border:0;background:transparent;color:#535353;padding:12px 13px;font-size:8px;letter-spacing:.08em;white-space:nowrap;
}
.tab.active{color:#d0d0d0;border-bottom:1px solid #d0d0d0}
.calendar-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:18px}
.calendar-head button{height:40px;border:0;background:transparent;color:#777;font-size:20px}
.calendar-head strong{text-align:center;font-size:14px;font-weight:400}
.week,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week{margin-top:14px}
.week div{text-align:center;color:#424242;font-size:7px;padding:5px 0}
.day{
  aspect-ratio:1;border:1px solid #151515;background:#010101;color:#323232;
  display:grid;place-items:center;position:relative;font-size:10px;
}
.day.has{color:#aaa;border-color:#303030}
.day.selected{color:#fff;border-color:#8a8a8a}
.day.today::after{content:"";position:absolute;bottom:5px;width:3px;height:3px;border-radius:50%;background:#888}
.day.has::before{content:"";position:absolute;top:5px;right:5px;width:3px;height:3px;border-radius:50%;background:#777}
.slot-block{margin-top:18px}
.slot-title{font-size:9px;color:#5d5d5d;letter-spacing:.1em;margin-bottom:8px}
.slot{
  width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:#c7c7c7;
  display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:13px 0;text-align:left;
}
.slot:last-child{border-bottom:1px solid var(--line)}
.slot-time{font-size:13px}
.slot-main strong{display:block;font-weight:400;font-size:11px}
.slot-main span{display:block;margin-top:4px;color:#565656;font-size:8px}
.search{
  width:100%;border:1px solid #2b2b2b;background:#030303;color:#ccc;outline:none;padding:12px;margin:16px 0 10px
}
.profile-hero{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-top:18px}
.avatar{
  width:72px;height:72px;border:1px solid #2e2e2e;background:#050505;display:grid;place-items:center;
  color:#767676;font-size:22px;
}
.profile-hero h2{margin:0;font-size:19px;font-weight:400}
.profile-hero p{margin:7px 0 0;color:#616161;font-size:10px;line-height:1.5}
.car-card{border:1px solid var(--line);margin-top:10px;overflow:hidden;background:#020202}
.car-image{height:146px;display:grid;place-items:center;background:radial-gradient(circle at 50% 76%,#171717 0,#050505 44%,#000 73%)}
.car-image img{width:95%;height:135px;object-fit:contain;display:block}
.car-copy{padding:12px;border-top:1px solid #1d1d1d}
.car-copy strong{font-size:13px;font-weight:400}
.car-copy span{display:block;margin-top:5px;color:#5f5f5f;font-size:9px}
.pref-row{
  border-bottom:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:34% 1fr;gap:10px;
}
.pref-row input{
  width:100%;border:0;background:transparent;color:#bcbcbc;outline:none;padding:0;font-size:10px;
}
.pref-row input:first-child{color:#606060}
.message-list{display:flex;flex-direction:column;gap:8px;padding:10px 0 80px}
.msg{max-width:85%;border:1px solid #292929;padding:10px 11px;font-size:10px;line-height:1.5;color:#bdbdbd}
.msg.client{align-self:flex-start;background:#030303}
.msg.admin{align-self:flex-end;background:#101010}
.msg-time{display:block;color:#4b4b4b;font-size:7px;margin-top:5px}
.composer{
  position:sticky;bottom:calc(-34px - env(safe-area-inset-bottom));background:#000;
  padding:10px 0 calc(34px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 46px;gap:8px;
}
.composer input{border:1px solid #2b2b2b;background:#050505;color:#ccc;outline:none;padding:12px}
.composer button{border:1px solid #333;background:#080808;color:#bbb}
.notice-row.read{opacity:.38}
.notice-title{font-size:12px}
.notice-dot{width:6px;height:6px;border-radius:50%;background:#d74242;flex:0 0 auto;margin-top:4px}
.notice-row.read .notice-dot{background:#303030}
.recipient-mode{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.recipient-mode button{
  min-height:42px;border:1px solid #292929;background:#030303;color:#676767;font-size:9px
}
.recipient-mode button.active{color:#ddd;border-color:#666}
.preview{
  border:1px solid #2b2b2b;background:#050505;padding:14px;margin-top:14px
}
.preview strong{font-size:12px;font-weight:400}
.preview p{font-size:10px;line-height:1.5;color:#777;margin:8px 0 0}
.money-positive{color:#bfbfbf}.money-negative{color:#9b6c6c}
.transaction-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.transaction-amount{text-align:right;font-size:13px}
.reset-demo{
  display:block;margin:30px auto 0;border:0;background:transparent;color:#313131;
  font-size:8px;border-bottom:1px solid #242424;padding:5px 0;
}
.sheet-shade{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:flex-end;
}
.sheet{
  width:100%;max-height:88vh;overflow:auto;background:#050505;border-top:1px solid #333;
  padding:22px 18px calc(24px + env(safe-area-inset-bottom));
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-size:17px;font-weight:400}
.sheet-close{border:0;background:transparent;color:#777;font-size:24px}
.service-check{
  display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);padding:10px 0;
}
.service-check input{width:16px;height:16px}
.service-check span{font-size:10px;color:#aaa}
.service-check em{font-style:normal;color:#606060;font-size:9px}
.mini-note{font-size:8px;color:#484848;line-height:1.5;margin-top:10px}
@media(min-width:700px){
  .view{max-width:720px;left:50%;transform:translateX(-50%);width:100%}
  .topbar{padding-left:max(18px,calc((100vw - 720px)/2));padding-right:max(18px,calc((100vw - 720px)/2))}
  .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* =========================================================
   T-CITY ADMIN v0.2 — CRM / ДР / VIP / T-БОНУСЫ
   ========================================================= */
.vip-badge{
  display:inline-block;border:1px solid #686868;color:#d0d0d0;padding:4px 6px;
  font-size:7px;letter-spacing:.12em;margin-left:7px;vertical-align:middle
}
.vip-switch{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:13px 0;margin-top:14px
}
.vip-switch span{font-size:10px;color:#8b8b8b}
.vip-switch input{width:20px;height:20px}
.bonus-admin-card{
  border:1px solid var(--line);background:#030303;padding:14px;margin-top:14px
}
.bonus-admin-head{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
.bonus-admin-coin{
  width:40px;height:40px;border:1px solid #3a3a3a;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;background:#000
}
.bonus-admin-coin img{width:33px;height:33px;object-fit:contain;filter:grayscale(1)}
.bonus-admin-head strong{font-size:12px;font-weight:400}
.bonus-admin-head small{display:block;color:#555;font-size:8px;margin-top:4px}
.bonus-admin-balance{font-size:18px;letter-spacing:-.03em}
.bonus-admin-history{border-top:1px solid #242424;margin-top:12px}
.bonus-admin-tx{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #242424;padding:9px 0}
.bonus-admin-tx strong{display:block;font-size:9px;font-weight:400}
.bonus-admin-tx small{display:block;font-size:7px;color:#4f4f4f;margin-top:4px}
.bonus-admin-tx span:last-child{font-size:10px}
.birthday-card{
  border:1px solid #303030;background:#030303;padding:16px;margin-top:18px
}
.birthday-card strong{font-size:13px;font-weight:400}
.birthday-card p{font-size:10px;line-height:1.55;color:#6d6d6d;margin:8px 0 0}
.reminder-row{
  border-bottom:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:12px
}
.reminder-row strong{display:block;font-size:10px;font-weight:400}
.reminder-row span{display:block;color:#575757;font-size:8px;margin-top:4px;line-height:1.4}
.time-source{
  margin-top:16px;padding:10px 0;border-top:1px solid #1f1f1f;color:#3f3f3f;
  font-size:8px;line-height:1.5;text-align:center
}
.finalize-box{
  border:1px solid #353535;background:#050505;padding:13px;margin-top:14px
}
.finalize-box strong{display:block;font-size:10px;font-weight:400}
.finalize-box span{display:block;margin-top:6px;color:#616161;font-size:8px;line-height:1.5}


/* Backend-connected ADMIN v0.4 */
.login-gate{min-height:68vh;display:flex;align-items:center;justify-content:center;padding:28px 0}
.login-card{width:100%;max-width:440px;border:1px solid #202020;padding:28px 22px;background:#090909}
.login-card .h1{margin-bottom:10px}
.login-status{font-size:9px;line-height:1.7;color:#666;margin:14px 0 0}
.server-badge{display:inline-flex;align-items:center;gap:7px;font-size:8px;letter-spacing:.12em;color:#777;margin-top:16px}
.server-badge:before{content:'';width:6px;height:6px;border-radius:50%;background:#8d8d8d}
.server-badge.ok:before{background:#d8d8d8}
.readonly-note{font-size:8px;line-height:1.6;color:#555;margin:-2px 0 13px}


.catalog-list{display:grid;border-top:1px solid var(--line);margin-top:18px}
.catalog-row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:16px 2px;text-align:left}
.catalog-row-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.catalog-row strong{font-size:14px;font-weight:400}
.catalog-meta{display:block;margin-top:6px;color:#666;font-size:9px;line-height:1.5}
.catalog-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.catalog-pill{border:1px solid #333;padding:4px 6px;color:#8b8b8b;font-size:7px;letter-spacing:.08em}
.catalog-pill.new{color:#ddd;border-color:#666}
.catalog-pill.popular{color:#bdbdbd;border-color:#4d4d4d}
.catalog-pill.off{opacity:.55}
.catalog-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:13px 0;color:#aaa;font-size:10px}
.catalog-toggle input{width:18px;height:18px;accent-color:#d8d8d8}
.catalog-service-picks{max-height:290px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
.catalog-price-help{margin-top:-6px;color:#555;font-size:8px;line-height:1.5}
</style>
</head>

<div id="sheetShade" class="sheet-shade hidden">
  <section class="sheet" id="sheet"></section>
</div>

function tCityParts(date=new Date()){
  const a=new Intl.DateTimeFormat('en-CA',{
    timeZone:T_CITY_TIMEZONE,year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  }).formatToParts(date).reduce((o,x)=>{o[x.type]=x.value;return o},{});
  return {
    year:Number(a.year),month:Number(a.month),day:Number(a.day),
    hour:Number(a.hour),minute:Number(a.minute),second:Number(a.second)
  };
}
function todayKey(){
  const x=tCityParts();
  return `${x.year}-${String(x.month).padStart(2,'0')}-${String(x.day).padStart(2,'0')}`;
}
function addDaysKey(key,days){
  const d=new Date(key+'T12:00:00Z');
  d.setUTCDate(d.getUTCDate()+days);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function birthDateFromKey(key,year){
  const [,m,d]=key.split('-');
  return `${year}-${m}-${d}`;
}
function fmtDate(key){
  const d=new Date(key+'T12:00:00');
  return `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
}

  }).format(new Date()).replace(',',' ·');
}

function ensureWallet(c){
  if(!c.wallet || typeof c.wallet!=='object') c.wallet={balance:0,earnedTotal:0,spentTotal:0,transactions:[]};
  if(!Array.isArray(c.wallet.transactions)) c.wallet.transactions=[];
  return c.wallet;
}
function walletCredit(c,amount,title){
  amount=Math.max(0,Math.round(Number(amount)||0));if(!amount)return 0;
  const w=ensureWallet(c);
  w.balance=(Number(w.balance)||0)+amount;
  w.earnedTotal=(Number(w.earnedTotal)||0)+amount;
  w.transactions.unshift({id:uid('tb'),type:'credit',amount,title,date:todayKey()});
  return amount;
}
function walletDebit(c,amount,title){
  const w=ensureWallet(c);
  amount=Math.min(Math.max(0,Math.round(Number(amount)||0)),Number(w.balance)||0);
  if(!amount)return 0;
  w.balance-=amount;
  w.spentTotal=(Number(w.spentTotal)||0)+amount;
  w.transactions.unshift({id:uid('tb'),type:'debit',amount,title,date:todayKey()});
  return amount;
}

function birthdayDistance(c){
  if(!c.birthday) return null;
  const [,m,d]=c.birthday.split('-').map(Number);
  const now=tCityParts();
  const year=now.year;
  const today=new Date(Date.UTC(year,now.month-1,now.day));
  let next=new Date(Date.UTC(year,m-1,d));
  if(next<today) next=new Date(Date.UTC(year+1,m-1,d));
  return Math.round((next-today)/86400000);
}
function generateScheduledAlerts(){
  let changed=false;
  const today=todayKey();

  state.clients.forEach(c=>{
    const dist=birthdayDistance(c);
    if(dist===0 || dist===1){
      const eventYear=tCityParts().year+(dist===0?0:0);
      const id=`birthday-${today}-${c.id}-${dist}`;
      if(!state.adminNotifications.some(n=>n.id===id)){
        state.adminNotifications.unshift({
          id,type:'birthday',clientId:c.id,
          title:dist===0?'Сегодня день рождения':'Завтра день рождения',
          text:`${c.name}${dist===0?' · поздравить сегодня':' · подготовить поздравление'}`,
          date:new Date().toISOString(),read:false
        });
        changed=true;
      }
    }

    (c.serviceReminders||[]).forEach(r=>{
      if(r.date<=today && !r.adminAlerted){
        state.adminNotifications.unshift({
          id:`service-${r.id}`,type:'service',clientId:c.id,reminderId:r.id,
          title:'Сервисное напоминание',
          text:`${c.name} · ${r.text}`,
          date:new Date().toISOString(),read:false
        });
        r.adminAlerted=true;
        changed=true;
      }
    });
  });

  if(changed)localStorage.setItem(LS_KEY,JSON.stringify(state));
}

function finalizeVisit(b){
  const c=bookingClient(b),car=bookingCar(b);
  if(!c||!car)return;
  if(!confirm('Завершить визит? Автомобиль будет считаться выданным клиенту.'))return;

  const wallet=ensureWallet(c);
  const requested=Math.max(0,Math.round(Number(b.bonusUse)||0));
  const used=Math.min(requested,Number(wallet.balance)||0,Math.round(Number(b.total)||0));
  if(used) walletDebit(c,used,`Оплата визита · ${car.name}`);

  const paidRub=Math.max(0,Math.round((Number(b.total)||0)-used));
  const cashback=Math.round(paidRub*0.05);
  if(cashback) walletCredit(c,cashback,`5% за визит · ${car.name}`);

  const visit={
    bookingId:b.id,date:b.date,car:car.name,services:servicesText(b),price:Number(b.total)||0,
    paidRub,bonusUse:used,bonusEarned:cashback
  };
  c.visits.unshift(visit);
  state.completedBookings.push({...clone(b),completedAt:new Date().toISOString(),paidRub,bonusUse:used,bonusEarned:cashback});
  state.bookings=state.bookings.filter(x=>x.id!==b.id);

  // Реальный денежный доход — только рублёвая часть.
  state.transactions.push({
    id:uid('t'),bookingId:b.id,date:b.date,type:'income',
    title:`${car.name} · завершённый визит`,amount:paidRub
  });

  state.adminNotifications.unshift({
    id:uid('n'),type:'completed',clientId:c.id,title:'Визит завершён',
    text:`${c.name} · ${car.name} · ${money(b.total)} · +${cashback} T`,
    date:new Date().toISOString(),read:false
  });

  save();
  openSheet(`
    <div class="sheet-head"><h3>ВИЗИТ ЗАВЕРШЁН</h3><button class="sheet-close" id="closeSheet">×</button></div>
    <div class="kv" style="margin-top:14px">
      <div class="kv-row"><span>Клиент</span><span>${c.name}</span></div>
      <div class="kv-row"><span>Автомобиль</span><span>${car.name}</span></div>
      <div class="kv-row"><span>Оплачено рублями</span><span>${money(paidRub)}</span></div>
      <div class="kv-row"><span>Списано T-Бонусов</span><span>${new Intl.NumberFormat('ru-RU').format(used)} T</span></div>
      <div class="kv-row"><span>Начислено 5%</span><span>+${new Intl.NumberFormat('ru-RU').format(cashback)} T</span></div>
      <div class="kv-row"><span>Баланс клиента</span><span>${new Intl.NumberFormat('ru-RU').format(ensureWallet(c).balance)} T</span></div>
    </div>
    <button class="action primary" id="finishToHome">ГОТОВО</button>
  `);
  document.getElementById('closeSheet').addEventListener('click',()=>{closeSheet();go('home',{},false)});
  document.getElementById('finishToHome').addEventListener('click',()=>{closeSheet();go('home',{},false)});
}

function openBookingEditor(b){
  const current=servicesFor(b);
  const c=bookingClient(b),car=bookingCar(b);
  const existingNames=new Set(current.map(x=>String(x.name).toLowerCase()));
  const choices=[
    ...current.map((x,i)=>({key:`current-${i}`,name:x.name,price:Number(x.price)||0,checked:true})),
    ...catalogState.services.filter(x=>x.enabled&&!existingNames.has(String(x.name).toLowerCase())).map(x=>({key:`catalog-${x.code}`,name:x.name,price:servicePriceForCar(x,car),checked:false}))
  ];
  openSheet(`
    <div class="sheet-head"><h3>ИЗМЕНИТЬ ЗАПИСЬ</h3><button class="sheet-close" id="closeSheet">×</button></div>
    <div class="inline2">
      <div class="field"><label>Дата</label><input type="date" id="editDate" value="${b.date}"></div>
      <div class="field"><label>Время</label><select id="editTime"></select></div>
    </div>
    <div class="inline2">
      <div class="field"><label>Время работ · часов</label><input type="number" min="1" max="8" id="editDuration" value="${Math.max(1,Number(b.duration)||1)}"></div>
      <div class="field"><label>Стоимость · ₽</label><input type="number" min="0" step="100" id="editTotal" value="${Number(b.total)||0}"></div>
    </div>
    <div class="field"><label>Услуги</label>
      ${choices.map((x,i)=>`<label class="service-check"><input type="checkbox" data-edit-service="${i}" ${x.checked?'checked':''}><span>${escapeHtmlAdmin(x.name)}</span><em>${money(x.price)}</em></label>`).join('')||'<div class="empty">Услуги пока не указаны.</div>'}
    </div>
    <div class="field"><label>Комментарий</label><textarea id="editComment">${b.comment||''}</textarea></div>
    <button class="action primary" id="saveBookingEdit">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
    <div class="mini-note">Показываются только свободные окна. Изменения сохраняются в базе и сразу видны клиенту.</div>
  `);
  const dateInput=document.getElementById('editDate'),durationInput=document.getElementById('editDuration'),timeSelect=document.getElementById('editTime');
  const refreshSlots=()=>{
    const date=dateInput.value,duration=Math.max(1,Math.min(8,Number(durationInput.value)||1));
    const slots=[];
    for(let h=10;h+duration<=21;h++){
      const start=h,end=h+duration;
      const occupied=state.bookings.some(x=>x.id!==b.id&&x.date===date&&['waiting','work','ready'].includes(x.status)&&(()=>{const sh=Number(String(x.time).slice(0,2)),eh=sh+Math.max(1,Number(x.duration)||1);return start<eh&&end>sh})());
      if(!occupied)slots.push(`${String(h).padStart(2,'0')}:00`);
    }
    if(!slots.length){timeSelect.innerHTML='<option value="">Нет свободных окон</option>';return}
    const preferred=slots.includes(b.time)?b.time:slots[0];
    timeSelect.innerHTML=slots.map(t=>`<option value="${t}" ${t===preferred?'selected':''}>${t}</option>`).join('');
  };
  refreshSlots();dateInput.addEventListener('change',refreshSlots);durationInput.addEventListener('input',refreshSlots);
  document.getElementById('closeSheet').addEventListener('click',closeSheet);
  document.getElementById('saveBookingEdit').addEventListener('click',async()=>{
    const date=dateInput.value,time=timeSelect.value;
    const durationHours=Math.max(1,Math.min(8,Number(durationInput.value)||1));
    const total=Math.max(0,Math.round(Number(document.getElementById('editTotal').value)||0));
    const selected=[...sheet.querySelectorAll('[data-edit-service]:checked')].map(el=>choices[Number(el.dataset.editService)]).filter(Boolean);
    const services=selected.map(x=>({name:x.name,price_rub:Math.max(0,Math.round(Number(x.price)||0))}));
    if(!date||!time){alert('На выбранную дату нет свободного окна для этой длительности.');return}
    try{
      await api(`/api/admin/bookings/${b.id}`,{method:'PATCH',body:jsonBody({starts_at:`${date}T${time}:00+05:00`,duration_minutes:Math.round(durationHours*60),preliminary_total_rub:total,bonus_spent:Math.min(Number(b.bonusUse)||0,total),comment:document.getElementById('editComment').value.trim(),services})});
      closeSheet();await refreshState();renderBooking();
    }catch(err){alert(err.status===409?'Это окно уже занято. Выберите другое время.':err.message)}
  });
}

async function imageFileData(file){
  if(!file)return null;const img=await new Promise((res,rej)=>{const i=new Image(),r=new FileReader();r.onload=()=>{i.onload=()=>res(i);i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)});const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.78);
}

function renderSupportChat(){
  const ch=state.supportChats.find(x=>x.id===route.params.id);if(!ch){back();return}const c=client(ch.clientId);shell(c?.name||'ПОДДЕРЖКА',`<div class="eyebrow">ОТВЕТ ОТ ИМЕНИ T-CITY</div><h1 class="h1">${c?.name||'КЛИЕНТ'}</h1><p class="lead">${c?.phone||'—'}</p><div class="message-list" id="messages">${ch.messages.map(m=>`<div class="msg ${m.side==='client'?'client':'admin'}">${m.text}<span class="msg-time">${m.time||''} · ${m.side==='client'?'КЛИЕНТ':'T-CITY'}</span></div>`).join('')}</div><div class="composer"><input id="replyText" placeholder="Ответить от имени T-CITY..."><button id="sendReply">↑</button></div>`);document.getElementById('sendReply').addEventListener('click',async()=>{const text=document.getElementById('replyText').value.trim();if(!text)return;try{await api(`/api/admin/support/${ch.id}/reply`,{method:'POST',body:jsonBody({message:text})});await refreshState();renderSupportChat()}catch(err){alert(err.message)}});
}
function renderMailing(){
  const preset=route.params.clientId||'',presetTitle=route.params.title||'',presetText=route.params.text||'';let mode=preset?'one':'all';shell('РАССЫЛКА',`<div class="eyebrow">УВЕДОМЛЕНИЯ КЛИЕНТАМ</div><h1 class="h1">РАССЫЛКА</h1><div class="recipient-mode"><button data-mode="all" class="${mode==='all'?'active':''}">ВСЕМ</button><button data-mode="one" class="${mode==='one'?'active':''}">ОДНОМУ</button></div><div class="field hidden" id="recipientField"><label>Клиент</label><select id="recipient">${state.clients.map(c=>`<option value="${c.id}" ${c.id===preset?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Заголовок</label><input id="mailTitle" value="${presetTitle}" placeholder="Например: Персональное предложение"></div><div class="field"><label>Текст</label><textarea id="mailText" placeholder="Сообщение клиенту...">${presetText}</textarea></div><div class="preview"><strong id="previewTitle">Предварительный просмотр</strong><p id="previewText">Здесь будет видно сообщение перед отправкой.</p></div><button class="action primary" id="sendMail">ОТПРАВИТЬ</button>`);
  const recipientField=document.getElementById('recipientField'),updateMode=()=>{recipientField.classList.toggle('hidden',mode!=='one');document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode))};updateMode();document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>{mode=x.dataset.mode;updateMode()}));const updatePreview=()=>{document.getElementById('previewTitle').textContent=document.getElementById('mailTitle').value.trim()||'Предварительный просмотр';document.getElementById('previewText').textContent=document.getElementById('mailText').value.trim()||'Здесь будет видно сообщение перед отправкой.'};document.getElementById('mailTitle').addEventListener('input',updatePreview);document.getElementById('mailText').addEventListener('input',updatePreview);
  document.getElementById('sendMail').addEventListener('click',async()=>{const title=document.getElementById('mailTitle').value.trim(),message=document.getElementById('mailText').value.trim();if(!title||!message)return;try{if(mode==='all')await api('/api/admin/broadcast',{method:'POST',body:jsonBody({mode:'all',title,message})});else await api(`/api/admin/notifications/client/${document.getElementById('recipient').value}`,{method:'POST',body:jsonBody({title,message,type:'personal'})});alert('Отправлено.');await refreshState();go('home',{},false)}catch(err){alert(err.message)}});
}
function renderAllTime(){const x=state.allTimeStats||{};shell('ЗА ВСЁ ВРЕМЯ',`<div class="eyebrow">T-CITY · ОБЩИЙ РЕЗУЛЬТАТ</div><h1 class="h1">ЗА ВСЁ ВРЕМЯ</h1><p class="lead">Данные из завершённых визитов на сервере.</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin-top:24px"><div class="metric"><strong>${Number(x.vehicles_serviced)||0}</strong><span>автомобилей обслужено</span></div><div class="metric"><strong>${money(x.sales_total_rub||0)}</strong><span>выручка за всё время</span></div></div><div class="metric" style="margin-top:8px"><strong>${money(x.average_check_rub||0)}</strong><span>средний чек</span></div>`);}
function renderAccounting(){const a=state.accountingSummary||{},incomes=Number(a.cash_revenue_rub||0)+Number(a.manual_income_rub||0),expenses=Number(a.expenses_rub||0);shell('УЧЁТ',`<div class="eyebrow">ФИНАНСЫ И СТАТИСТИКА</div><h1 class="h1">УЧЁТ</h1><div class="metrics"><div class="metric"><strong>${money(incomes)}</strong><span>доходы</span></div><div class="metric"><strong>${money(expenses)}</strong><span>расходы</span></div><div class="metric"><strong>${money(a.profit_rub||0)}</strong><span>результат</span></div><div class="metric"><strong>${a.completed_visits||0}</strong><span>машин обслужено</span></div><div class="metric"><strong>${state.bookings.length}</strong><span>записано</span></div><div class="metric"><strong>${state.bookings.filter(b=>['waiting','work','ready'].includes(b.status)).length}</strong><span>предстоит</span></div></div><div class="inline2"><button class="action" id="addIncome">+ ДОХОД</button><button class="action" id="addExpense">+ РАСХОД</button></div><div class="section-title" style="margin-top:22px">ОПЕРАЦИИ</div><div class="transaction-list">${[...state.transactions].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(t=>`<div class="transaction-row"><span><strong style="font-size:11px;font-weight:400">${t.title}</strong><span class="transaction-meta">${fmtDate(t.date)} · ${t.type==='income'?'доход':'расход'}</span></span><span class="transaction-amount ${t.type==='income'?'money-positive':'money-negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span></div>`).join('')}</div>`);document.getElementById('addIncome').addEventListener('click',()=>openTransaction('income'));document.getElementById('addExpense').addEventListener('click',()=>openTransaction('expense'));}
function openTransaction(type){openSheet(`<div class="sheet-head"><h3>${type==='income'?'ДОБАВИТЬ ДОХОД':'ДОБАВИТЬ РАСХОД'}</h3><button class="sheet-close" id="closeSheet">×</button></div><div class="field"><label>Описание</label><input id="trTitle"></div><div class="field"><label>Сумма</label><input type="number" min="0" id="trAmount"></div><button class="action primary" id="saveTransaction">СОХРАНИТЬ</button>`);document.getElementById('closeSheet').addEventListener('click',closeSheet);document.getElementById('saveTransaction').addEventListener('click',async()=>{const amount=Number(document.getElementById('trAmount').value),description=document.getElementById('trTitle').value.trim();if(!amount||!description)return;try{await api('/api/admin/accounting/entries',{method:'POST',body:jsonBody({type,amount_rub:amount,description})});closeSheet();await refreshState();renderAccounting()}catch(err){alert(err.message)}});}
function renderBirthdayComposer(){const c=client(route.params.clientId);if(!c){back();return}const first=(c.name||'').split(/\s+/)[0]||'',defaultText=`${first}, поздравляем вас с днём рождения! Команда T-CITY желает вам отличного настроения и приятных событий. Спасибо, что вы с нами.`;shell('ДЕНЬ РОЖДЕНИЯ',`<div class="eyebrow">ПЕРСОНАЛЬНОЕ ПОЗДРАВЛЕНИЕ</div><h1 class="h1">${c.name}</h1><div class="birthday-card"><strong>${c.birthday?`День рождения · ${c.birthday.split('-').slice(1).reverse().join('.')}`:'Дата рождения не указана'}</strong><p>Текст можно изменить перед отправкой. Подарок и T-Бонусы задаёте вы лично.</p></div><div class="field"><label>Текст поздравления</label><textarea id="birthdayText">${defaultText}</textarea></div><div class="field"><label>Подарок / бесплатная услуга / скидка</label><input id="birthdayGift" placeholder="Например: бесплатная полировка фар"></div><div class="field"><label>T-Бонусы в подарок</label><input type="number" min="0" id="birthdayBonus" placeholder="Например: 5000"></div><button class="action primary" id="sendBirthday">ОТПРАВИТЬ КЛИЕНТУ</button>`);document.getElementById('sendBirthday').addEventListener('click',async()=>{const message=document.getElementById('birthdayText').value.trim(),gift_text=document.getElementById('birthdayGift').value.trim(),bonus_amount=Math.max(0,Math.round(Number(document.getElementById('birthdayBonus').value)||0));if(!message)return;try{await api(`/api/admin/notifications/client/${c.id}/gift`,{method:'POST',body:jsonBody({title:'С днём рождения!',message,gift_text,bonus_amount})});alert('Поздравление отправлено.');await refreshState();go('client',{id:c.id,tab:'main'},false)}catch(err){alert(err.message)}});}
function renderNotifications(){shell('УВЕДОМЛЕНИЯ',`<div class="eyebrow">ТОЛЬКО ДЛЯ ADMIN</div><h1 class="h1">УВЕДОМЛЕНИЯ</h1><div class="toolbar"><button class="action small" id="markAll">ПРОЧИТАТЬ ВСЕ</button><button class="action small danger" id="clearNotices">ОЧИСТИТЬ ИСТОРИЮ</button></div><div class="notice-list">${state.adminNotifications.map(n=>`<button class="notice-row ${n.read?'read':''}" data-notice="${n.id}"><div class="notice-row-top"><span><span class="notice-title">${n.title}</span><span class="notice-meta">${n.text}<br>${new Date(n.date).toLocaleString('ru-RU',{timeZone:T_CITY_TIMEZONE,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></span><span class="notice-dot"></span></div></button>`).join('')||'<div class="empty">История уведомлений пуста.</div>'}</div>`);
  view.querySelectorAll('[data-notice]').forEach(x=>x.addEventListener('click',async()=>{const n=state.adminNotifications.find(n=>n.id===x.dataset.notice);if(!n)return;if(!n.virtual){try{await api(`/api/admin/notifications/${n.id}/read`,{method:'PATCH'})}catch(_){}}n.read=true;updateBell();if(n.type==='birthday'&&n.clientId){go('birthday',{clientId:n.clientId});return}renderNotifications()}));
  document.getElementById('markAll').addEventListener('click',async()=>{for(const n of state.adminNotifications.filter(x=>!x.read&&!x.virtual)){try{await api(`/api/admin/notifications/${n.id}/read`,{method:'PATCH'})}catch(_){}}await refreshState();renderNotifications()});
  document.getElementById('clearNotices').addEventListener('click',async()=>{if(!confirm('Очистить историю уведомлений только в ADMIN?'))return;for(const n of state.adminNotifications.filter(x=>!x.virtual)){try{await api(`/api/admin/notifications/${n.id}`,{method:'DELETE'})}catch(_){}}await refreshState();renderNotifications()});
}


function catalogPriceInput(item){
  const a=Number(item?.price_sedan)||0,b=Number(item?.price_crossover)||0,c=Number(item?.price_suv)||0;
  return a===b&&b===c?String(a):`${a}/${b}/${c}`;
}
function catalogPriceLabel(item){
  const a=Number(item?.price_sedan)||0,b=Number(item?.price_crossover)||0,c=Number(item?.price_suv)||0;
  return a===b&&b===c?money(a):`${new Intl.NumberFormat('ru-RU').format(a)} / ${new Intl.NumberFormat('ru-RU').format(b)} / ${new Intl.NumberFormat('ru-RU').format(c)} ₽`;
}
function parseCatalogPrice(value){
  const parts=String(value||'').split('/').map(x=>Number(String(x).replace(/\s/g,'')));
  if(parts.length===1&&Number.isInteger(parts[0])&&parts[0]>=0)return {sedan:parts[0],crossover:parts[0],suv:parts[0]};
  if(parts.length===3&&parts.every(x=>Number.isInteger(x)&&x>=0))return {sedan:parts[0],crossover:parts[1],suv:parts[2]};
  return null;
}
function adminCarType(car){
  const t=String(car?.bodyType||car?.name||'').toLowerCase();
  if(t.includes('кроссов')||t.includes('crossover'))return 'crossover';
  if(t.includes('внедорож')||t.includes('suv'))return 'suv';
  return 'sedan';
}
function servicePriceForCar(s,car){
  const type=adminCarType(car);return Number(s?.[`price_${type}`]??s?.prices?.[type]??s?.price_crossover??s?.price)||0;
}
function renderCatalog(){
  const tab=route.params.tab||'services';
  shell('УСЛУГИ И ЦЕНЫ',`<div class="eyebrow">CLIENT · ЕДИНЫЙ ПРАЙС</div><h1 class="h1">УСЛУГИ И ЦЕНЫ</h1><p class="lead">Все изменения здесь сразу используются клиентской версией. GitHub для изменения цены больше не нужен.</p><div class="tabs"><button class="tab ${tab==='services'?'active':''}" data-catalog-tab="services">УСЛУГИ</button><button class="tab ${tab==='packages'?'active':''}" data-catalog-tab="packages">ПАКЕТЫ</button></div><div id="catalogBody"></div>`);
  view.querySelectorAll('[data-catalog-tab]').forEach(x=>x.addEventListener('click',()=>{route.params.tab=x.dataset.catalogTab;renderCatalog()}));
  const box=document.getElementById('catalogBody');
  if(tab==='packages')renderCatalogPackages(box);else renderCatalogServices(box);
}
function renderCatalogServices(box){
  const rows=[...catalogState.services].sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
  box.innerHTML=`<button class="action primary" id="addCatalogService">+ ДОБАВИТЬ УСЛУГУ</button><div class="catalog-list">${rows.map(s=>`<button class="catalog-row" data-catalog-service="${s.code}"><div class="catalog-row-top"><strong>${escapeHtmlAdmin(s.name)}</strong><span class="catalog-badges">${s.is_new?'<span class="catalog-pill new">NEW</span>':''}${s.popular?'<span class="catalog-pill popular">ПОПУЛЯРНО</span>':''}${!s.enabled?'<span class="catalog-pill off">ВЫКЛ</span>':''}</span></div><span class="catalog-meta">${catalogPriceLabel(s)}${!s.enabled?' · скрыта в CLIENT':''}</span></button>`).join('')||'<div class="empty">Услуг пока нет.</div>'}</div>`;
  document.getElementById('addCatalogService').addEventListener('click',()=>openCatalogServiceEditor(null));
  box.querySelectorAll('[data-catalog-service]').forEach(x=>x.addEventListener('click',()=>openCatalogServiceEditor(catalogState.services.find(s=>s.code===x.dataset.catalogService))));
}
function escapeHtmlAdmin(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function openCatalogServiceEditor(item){
  const creating=!item;
  openSheet(`<div class="sheet-head"><h3>${creating?'НОВАЯ УСЛУГА':'ИЗМЕНИТЬ УСЛУГУ'}</h3><button class="sheet-close" id="closeSheet">×</button></div><div class="field"><label>Название</label><input id="catalogServiceName" value="${escapeHtmlAdmin(item?.name||'')}" placeholder="Например: Сухой туман"></div><div class="field"><label>Цена · ₽</label><input id="catalogServicePrice" value="${item?catalogPriceInput(item):''}" placeholder="1000 или 1000/1200/1400"></div><div class="catalog-price-help">Одно число применяется ко всем кузовам. Три числа: седан / кроссовер / внедорожник.</div><label class="catalog-toggle"><span>ПОКАЗЫВАТЬ УСЛУГУ В CLIENT</span><input type="checkbox" id="catalogServiceEnabled" ${item?.enabled!==false?'checked':''}></label><label class="catalog-toggle"><span>ОТМЕТКА «ПОПУЛЯРНО»</span><input type="checkbox" id="catalogServicePopular" ${item?.popular?'checked':''}></label><button class="action primary" id="saveCatalogService">СОХРАНИТЬ</button>${creating?'':`<button class="action" id="announceCatalogService">РАССКАЗАТЬ КЛИЕНТАМ</button><button class="action danger" id="deleteCatalogService">УДАЛИТЬ УСЛУГУ</button>`}<div class="mini-note">Новая услуга автоматически получает отметку NEW на 7 дней. Изменение цены старой услуги не включает NEW заново.</div>`);
  document.getElementById('closeSheet').addEventListener('click',closeSheet);
  document.getElementById('saveCatalogService').addEventListener('click',async()=>{const name=document.getElementById('catalogServiceName').value.trim(),prices=parseCatalogPrice(document.getElementById('catalogServicePrice').value);if(!name){alert('Укажите название услуги.');return}if(!prices){alert('Цена: одно число или три числа через /. Например 1000 или 1000/1200/1400.');return}const body={name,price_sedan:prices.sedan,price_crossover:prices.crossover,price_suv:prices.suv,enabled:document.getElementById('catalogServiceEnabled').checked,popular:document.getElementById('catalogServicePopular').checked};try{if(creating)await api('/api/admin/catalog/services',{method:'POST',body:jsonBody(body)});else await api(`/api/admin/catalog/services/${encodeURIComponent(item.code)}`,{method:'PATCH',body:jsonBody(body)});closeSheet();await refreshState();renderCatalog()}catch(err){alert(err.message)}});
  if(!creating){
    document.getElementById('announceCatalogService').addEventListener('click',()=>{const name=document.getElementById('catalogServiceName').value.trim()||item.name,price=document.getElementById('catalogServicePrice').value.trim()||catalogPriceInput(item);closeSheet();go('mailing',{title:'Новая услуга T-CITY',text:`В T-CITY появилась новая услуга — ${name}. Стоимость: ${price.includes('/')?price.replaceAll('/',' / ')+' ₽':price+' ₽'}. Подробнее можно посмотреть в разделе «Услуги и цены».`})});
    document.getElementById('deleteCatalogService').addEventListener('click',async()=>{if(!confirm(`Удалить услугу «${item.name}»? Из новых записей она исчезнет. История уже созданных записей сохранится.`))return;try{await api(`/api/admin/catalog/services/${encodeURIComponent(item.code)}`,{method:'DELETE'});closeSheet();await refreshState();renderCatalog()}catch(err){alert(err.message)}});
  }
}
function renderCatalogPackages(box){
  const rows=[...catalogState.packages].sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
  box.innerHTML=`<div class="catalog-list">${rows.map(p=>`<button class="catalog-row" data-catalog-package="${p.code}"><div class="catalog-row-top"><strong>${escapeHtmlAdmin(p.name)}</strong><span class="arrow">→</span></div><span class="catalog-meta">${catalogPriceLabel(p)} · ${(p.included_service_codes||[]).length} услуг</span></button>`).join('')||'<div class="empty">Пакетов пока нет.</div>'}</div>`;
  box.querySelectorAll('[data-catalog-package]').forEach(x=>x.addEventListener('click',()=>openCatalogPackageEditor(catalogState.packages.find(p=>p.code===x.dataset.catalogPackage))));
}
function openCatalogPackageEditor(item){
  if(!item)return;
  const included=new Set(item.included_service_codes||[]);
  const services=[...catalogState.services].sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
  openSheet(`<div class="sheet-head"><h3>ИЗМЕНИТЬ ПАКЕТ</h3><button class="sheet-close" id="closeSheet">×</button></div><div class="field"><label>Название</label><input id="catalogPackageName" value="${escapeHtmlAdmin(item.name)}"></div><div class="field"><label>Цена · ₽</label><input id="catalogPackagePrice" value="${catalogPriceInput(item)}" placeholder="1000 или 1000/1200/1400"></div><div class="catalog-price-help">Одно число — одинаковая цена. Три числа: седан / кроссовер / внедорожник.</div><div class="field"><label>Содержание пакета</label><div class="catalog-service-picks">${services.map(s=>`<label class="service-check"><input type="checkbox" data-package-service="${s.code}" ${included.has(s.code)?'checked':''}><span>${escapeHtmlAdmin(s.name)}${!s.enabled?' · ВЫКЛ':''}</span><em>${catalogPriceLabel(s)}</em></label>`).join('')}</div></div><button class="action primary" id="saveCatalogPackage">СОХРАНИТЬ ПАКЕТ</button>`);
  document.getElementById('closeSheet').addEventListener('click',closeSheet);
  document.getElementById('saveCatalogPackage').addEventListener('click',async()=>{const name=document.getElementById('catalogPackageName').value.trim(),prices=parseCatalogPrice(document.getElementById('catalogPackagePrice').value),codes=[...sheet.querySelectorAll('[data-package-service]:checked')].map(x=>x.dataset.packageService);if(!name){alert('Укажите название пакета.');return}if(!prices){alert('Цена: одно число или три числа через /.');return}try{await api(`/api/admin/catalog/packages/${encodeURIComponent(item.code)}`,{method:'PATCH',body:jsonBody({name,price_sedan:prices.sedan,price_crossover:prices.crossover,price_suv:prices.suv,included_service_codes:codes})});closeSheet();await refreshState();renderCatalog()}catch(err){alert(err.message)}});
}

bootRealAdmin();
