<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>T-CITY ADMIN</title>
<style>
*{box-sizing:border-box}
:root{
  font-family:Arial,Helvetica,sans-serif;
  background:#000;color:#ececec;
  --line:#252525;--line2:#343434;--muted:#666;--muted2:#888;--panel:#070707;
}
html,body{margin:0;width:100%;height:100%;background:#000}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0;background:#000;color:#ececec;overflow:hidden}
.topbar{
  position:absolute;left:0;right:0;top:0;height:calc(64px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 18px 0;
  display:grid;grid-template-columns:46px 1fr 46px;align-items:center;
  border-bottom:1px solid var(--line);background:#000;z-index:30;
}
.topbar button{
  width:42px;height:42px;border:0;background:transparent;color:#aaa;
  display:grid;place-items:center;font-size:23px;padding:0;
}
.top-title{text-align:center}
.top-title strong{display:block;font-size:12px;font-weight:500;letter-spacing:.13em}
.top-title span{display:block;margin-top:3px;color:#494949;font-size:8px;letter-spacing:.12em}
.bell-wrap{position:relative}
.bell-dot{
  position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#d74242;
}
.view{
  position:absolute;left:0;right:0;
  top:calc(64px + env(safe-area-inset-top));
  bottom:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:22px 18px calc(34px + env(safe-area-inset-bottom));
}
.eyebrow{font-size:8px;color:#555;letter-spacing:.14em;text-transform:uppercase}
.h1{font-size:30px;line-height:1.02;font-weight:400;letter-spacing:-.035em;margin:8px 0 0}
.lead{font-size:11px;line-height:1.55;color:#6d6d6d;margin:10px 0 0;max-width:520px}
.rule{border-top:1px solid var(--line);margin:22px 0}
.section-title{font-size:9px;color:#5f5f5f;letter-spacing:.12em;margin:0 0 10px;text-transform:uppercase}
.nav-list{border-top:1px solid var(--line);margin-top:22px}
.nav-row{
  width:100%;min-height:72px;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:#d4d4d4;text-align:left;
  display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:0 2px;
}
.nav-icon{font-size:18px;color:#777;text-align:center}
.nav-copy strong{display:block;font-size:14px;font-weight:400}
.nav-copy span{display:block;margin-top:5px;color:#575757;font-size:9px;line-height:1.4}
.arrow{color:#444;font-size:17px}
.metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px;
}
.metric{border:1px solid var(--line);background:#030303;padding:14px;min-height:84px}
.metric strong{display:block;font-size:24px;font-weight:400;letter-spacing:-.04em}
.metric span{display:block;color:#5b5b5b;font-size:8px;letter-spacing:.08em;margin-top:8px;text-transform:uppercase}
.today-list,.client-list,.notice-list,.chat-list,.transaction-list{border-top:1px solid var(--line)}
.booking-row,.client-row,.notice-row,.chat-row,.transaction-row{
  width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:#d1d1d1;
  text-align:left;padding:15px 2px;display:block;
}
.booking-row-top,.client-row-top,.notice-row-top,.chat-row-top,.transaction-row-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px
}
.booking-row strong,.client-row strong,.chat-row strong{font-weight:400;font-size:14px}
.booking-time{font-size:18px;letter-spacing:-.02em;min-width:54px}
.booking-meta,.client-meta,.notice-meta,.chat-meta,.transaction-meta{
  margin-top:6px;color:#606060;font-size:9px;line-height:1.5
}
.status{
  display:inline-block;border:1px solid #313131;color:#737373;padding:4px 6px;
  font-size:7px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.status.work{color:#aaa;border-color:#454545}
.status.ready{color:#d5d5d5;border-color:#686868}
.empty{border:1px solid var(--line);padding:20px;color:#535353;font-size:11px;line-height:1.5;text-align:center}
.action{
  width:100%;min-height:48px;border:1px solid #303030;background:#050505;color:#bdbdbd;
  margin-top:10px;padding:0 14px;
}
.action.primary{background:#e6e6e6;color:#090909;border-color:#e6e6e6}
.action.danger{color:#c76767;border-color:#4b2929;background:#090303}
.action.small{width:auto;min-height:36px;margin:0;padding:0 12px;font-size:9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.field{margin-top:14px}
.field label{display:block;color:#595959;font-size:8px;letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase}
.field input,.field textarea,.field select{
  width:100%;border:1px solid #2b2b2b;background:#050505;color:#d0d0d0;outline:none;
  border-radius:0;padding:12px;min-height:44px;
}
.field textarea{min-height:104px;resize:vertical;line-height:1.5}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);background:#030303;padding:14px;margin-top:10px}
.kv{border-top:1px solid var(--line)}
.kv-row{display:grid;grid-template-columns:42% 1fr;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}
.kv-row span:first-child{color:#5d5d5d;font-size:9px}
.kv-row span:last-child{color:#bdbdbd;font-size:10px;text-align:right;word-break:break-word}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;margin:18px 0 0}
.tab{
  border:0;background:transparent;color:#535353;padding:12px 13px;font-size:8px;letter-spacing:.08em;white-space:nowrap;
}
.tab.active{color:#d0d0d0;border-bottom:1px solid #d0d0d0}
.calendar-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:18px}
.calendar-head button{height:40px;border:0;background:transparent;color:#777;font-size:20px}
.calendar-head strong{text-align:center;font-size:14px;font-weight:400}
.week,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week{margin-top:14px}
.week div{text-align:center;color:#424242;font-size:7px;padding:5px 0}
.day{
  aspect-ratio:1;border:1px solid #151515;background:#010101;color:#323232;
  display:grid;place-items:center;position:relative;font-size:10px;
}
.day.has{color:#aaa;border-color:#303030}
.day.selected{color:#fff;border-color:#8a8a8a}
.day.today::after{content:"";position:absolute;bottom:5px;width:3px;height:3px;border-radius:50%;background:#888}
.day.has::before{content:"";position:absolute;top:5px;right:5px;width:3px;height:3px;border-radius:50%;background:#777}
.slot-block{margin-top:18px}
.slot-title{font-size:9px;color:#5d5d5d;letter-spacing:.1em;margin-bottom:8px}
.slot{
  width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:#c7c7c7;
  display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:13px 0;text-align:left;
}
.slot:last-child{border-bottom:1px solid var(--line)}
.slot-time{font-size:13px}
.slot-main strong{display:block;font-weight:400;font-size:11px}
.slot-main span{display:block;margin-top:4px;color:#565656;font-size:8px}
.search{
  width:100%;border:1px solid #2b2b2b;background:#030303;color:#ccc;outline:none;padding:12px;margin:16px 0 10px
}
.profile-hero{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-top:18px}
.avatar{
  width:72px;height:72px;border:1px solid #2e2e2e;background:#050505;display:grid;place-items:center;
  color:#767676;font-size:22px;
}
.profile-hero h2{margin:0;font-size:19px;font-weight:400}
.profile-hero p{margin:7px 0 0;color:#616161;font-size:10px;line-height:1.5}
.car-card{border:1px solid var(--line);margin-top:10px;overflow:hidden;background:#020202}
.car-image{height:146px;display:grid;place-items:center;background:radial-gradient(circle at 50% 76%,#171717 0,#050505 44%,#000 73%)}
.car-image img{width:95%;height:135px;object-fit:contain;display:block}
.car-copy{padding:12px;border-top:1px solid #1d1d1d}
.car-copy strong{font-size:13px;font-weight:400}
.car-copy span{display:block;margin-top:5px;color:#5f5f5f;font-size:9px}
.pref-row{
  border-bottom:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:34% 1fr;gap:10px;
}
.pref-row input{
  width:100%;border:0;background:transparent;color:#bcbcbc;outline:none;padding:0;font-size:10px;
}
.pref-row input:first-child{color:#606060}
.message-list{display:flex;flex-direction:column;gap:8px;padding:10px 0 80px}
.msg{max-width:85%;border:1px solid #292929;padding:10px 11px;font-size:10px;line-height:1.5;color:#bdbdbd}
.msg.client{align-self:flex-start;background:#030303}
.msg.admin{align-self:flex-end;background:#101010}
.msg-time{display:block;color:#4b4b4b;font-size:7px;margin-top:5px}
.composer{
  position:sticky;bottom:calc(-34px - env(safe-area-inset-bottom));background:#000;
  padding:10px 0 calc(34px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 46px;gap:8px;
}
.composer input{border:1px solid #2b2b2b;background:#050505;color:#ccc;outline:none;padding:12px}
.composer button{border:1px solid #333;background:#080808;color:#bbb}
.notice-row.read{opacity:.38}
.notice-title{font-size:12px}
.notice-dot{width:6px;height:6px;border-radius:50%;background:#d74242;flex:0 0 auto;margin-top:4px}
.notice-row.read .notice-dot{background:#303030}
.recipient-mode{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.recipient-mode button{
  min-height:42px;border:1px solid #292929;background:#030303;color:#676767;font-size:9px
}
.recipient-mode button.active{color:#ddd;border-color:#666}
.preview{
  border:1px solid #2b2b2b;background:#050505;padding:14px;margin-top:14px
}
.preview strong{font-size:12px;font-weight:400}
.preview p{font-size:10px;line-height:1.5;color:#777;margin:8px 0 0}
.money-positive{color:#bfbfbf}.money-negative{color:#9b6c6c}
.transaction-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.transaction-amount{text-align:right;font-size:13px}
.reset-demo{
  display:block;margin:30px auto 0;border:0;background:transparent;color:#313131;
  font-size:8px;border-bottom:1px solid #242424;padding:5px 0;
}
.sheet-shade{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:flex-end;
}
.sheet{
  width:100%;max-height:88vh;overflow:auto;background:#050505;border-top:1px solid #333;
  padding:22px 18px calc(24px + env(safe-area-inset-bottom));
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-size:17px;font-weight:400}
.sheet-close{border:0;background:transparent;color:#777;font-size:24px}
.service-check{
  display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);padding:10px 0;
}
.service-check input{width:16px;height:16px}
.service-check span{font-size:10px;color:#aaa}
.service-check em{font-style:normal;color:#606060;font-size:9px}
.mini-note{font-size:8px;color:#484848;line-height:1.5;margin-top:10px}
@media(min-width:700px){
  .view{max-width:720px;left:50%;transform:translateX(-50%);width:100%}
  .topbar{padding-left:max(18px,calc((100vw - 720px)/2));padding-right:max(18px,calc((100vw - 720px)/2))}
  .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
}

.vip-switch{

  border-top:1px solid var(--line);border-bottom:1px solid var(--line);

.bonus-admin-card{
  border:1px solid var(--line);background:#030303;padding:14px;margin-top:14px

.bonus-admin-head{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
.bonus-admin-coin{
  width:40px;height:40px;border:1px solid #3a3a3a;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;background:#000

.bonus-admin-coin img{width:33px;height:33px;object-fit:contain;filter:grayscale(1)}
.bonus-admin-head strong{font-size:12px;font-weight:400}
.bonus-admin-head small{display:block;color:#555;font-size:8px;margin-top:4px}
.bonus-admin-balance{font-size:18px;letter-spacing:-.03em}
.bonus-admin-history{border-top:1px solid #242424;margin-top:12px}
.bonus-admin-tx{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #242424;padding:9px 0}
.bonus-admin-tx strong{display:block;font-size:9px;font-weight:400}
.bonus-admin-tx small{display:block;font-size:7px;color:#4f4f4f;margin-top:4px}
.bonus-admin-tx span:last-child{font-size:10px}
.birthday-card{
  border:1px solid #303030;background:#030303;padding:16px;margin-top:18px
}
.birthday-card strong{font-size:13px;font-weight:400}
.birthday-card p{font-size:10px;line-height:1.55;color:#6d6d6d;margin:8px 0 0}
.reminder-row{
  border-bottom:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:12px
}
.reminder-row strong{display:block;font-size:10px;font-weight:400}
.reminder-row span{display:block;color:#575757;font-size:8px;margin-top:4px;line-height:1.4}
.time-source{
  margin-top:16px;padding:10px 0;border-top:1px solid #1f1f1f;color:#3f3f3f;
  font-size:8px;line-height:1.5;text-align:center
}
.finalize-box{
  border:1px solid #353535;background:#050505;padding:13px;margin-top:14px
}
.finalize-box strong{display:block;font-size:10px;font-weight:400}
.finalize-box span{display:block;margin-top:6px;color:#616161;font-size:8px;line-height:1.5}

</style>
</head>

function tCityParts(date=new Date()){
  const a=new Intl.DateTimeFormat('en-CA',{
    timeZone:T_CITY_TIMEZONE,year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  }).formatToParts(date).reduce((o,x)=>{o[x.type]=x.value;return o},{});
  return {
    year:Number(a.year),month:Number(a.month),day:Number(a.day),
    hour:Number(a.hour),minute:Number(a.minute),second:Number(a.second)
  };
}
function todayKey(){
  const x=tCityParts();
  return `${x.year}-${String(x.month).padStart(2,'0')}-${String(x.day).padStart(2,'0')}`;
}
function addDaysKey(key,days){
  const d=new Date(key+'T12:00:00Z');
  d.setUTCDate(d.getUTCDate()+days);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function birthDateFromKey(key,year){
  const [,m,d]=key.split('-');
  return `${year}-${m}-${d}`;
}
function fmtDate(key){
  const d=new Date(key+'T12:00:00');
  return `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
}
function tCityClockText(){

    timeZone:T_CITY_TIMEZONE,day:'2-digit',month:'2-digit',

  }).format(new Date()).replace(',',' ·');
}

function ensureWallet(c){
  if(!c.wallet || typeof c.wallet!=='object') c.wallet={balance:0,earnedTotal:0,spentTotal:0,transactions:[]};
  if(!Array.isArray(c.wallet.transactions)) c.wallet.transactions=[];
  return c.wallet;
}
function walletCredit(c,amount,title){
  amount=Math.max(0,Math.round(Number(amount)||0));if(!amount)return 0;
  const w=ensureWallet(c);
  w.balance=(Number(w.balance)||0)+amount;
  w.earnedTotal=(Number(w.earnedTotal)||0)+amount;
  w.transactions.unshift({id:uid('tb'),type:'credit',amount,title,date:todayKey()});
  return amount;
}
function walletDebit(c,amount,title){
  const w=ensureWallet(c);
  amount=Math.min(Math.max(0,Math.round(Number(amount)||0)),Number(w.balance)||0);
  if(!amount)return 0;
  w.balance-=amount;
  w.spentTotal=(Number(w.spentTotal)||0)+amount;
  w.transactions.unshift({id:uid('tb'),type:'debit',amount,title,date:todayKey()});
  return amount;
}

function birthdayDistance(c){
  if(!c.birthday) return null;
  const [,m,d]=c.birthday.split('-').map(Number);
  const now=tCityParts();
  const year=now.year;
  const today=new Date(Date.UTC(year,now.month-1,now.day));
  let next=new Date(Date.UTC(year,m-1,d));
  if(next<today) next=new Date(Date.UTC(year+1,m-1,d));
  return Math.round((next-today)/86400000);
}
function generateScheduledAlerts(){
  let changed=false;
  const today=todayKey();

  state.clients.forEach(c=>{
    const dist=birthdayDistance(c);
    if(dist===0 || dist===1){
      const eventYear=tCityParts().year+(dist===0?0:0);
      const id=`birthday-${today}-${c.id}-${dist}`;
      if(!state.adminNotifications.some(n=>n.id===id)){
        state.adminNotifications.unshift({
          id,type:'birthday',clientId:c.id,
          title:dist===0?'Сегодня день рождения':'Завтра день рождения',
          text:`${c.name}${dist===0?' · поздравить сегодня':' · подготовить поздравление'}`,
          date:new Date().toISOString(),read:false
        });
        changed=true;
      }
    }

    (c.serviceReminders||[]).forEach(r=>{
      if(r.date<=today && !r.adminAlerted){
        state.adminNotifications.unshift({
          id:`service-${r.id}`,type:'service',clientId:c.id,reminderId:r.id,
          title:'Сервисное напоминание',
          text:`${c.name} · ${r.text}`,
          date:new Date().toISOString(),read:false
        });
        r.adminAlerted=true;
        changed=true;
      }
    });
  });

  if(changed)localStorage.setItem(LS_KEY,JSON.stringify(state));
}

function finalizeVisit(b){
  const c=bookingClient(b),car=bookingCar(b);
  if(!c||!car)return;
  if(!confirm('Завершить визит? Автомобиль будет считаться выданным клиенту.'))return;

  const wallet=ensureWallet(c);
  const requested=Math.max(0,Math.round(Number(b.bonusUse)||0));
  const used=Math.min(requested,Number(wallet.balance)||0,Math.round(Number(b.total)||0));
  if(used) walletDebit(c,used,`Оплата визита · ${car.name}`);

  const paidRub=Math.max(0,Math.round((Number(b.total)||0)-used));
  const cashback=Math.round(paidRub*0.05);
  if(cashback) walletCredit(c,cashback,`5% за визит · ${car.name}`);

  const visit={
    bookingId:b.id,date:b.date,car:car.name,services:servicesText(b),price:Number(b.total)||0,
    paidRub,bonusUse:used,bonusEarned:cashback
  };
  c.visits.unshift(visit);
  state.completedBookings.push({...clone(b),completedAt:new Date().toISOString(),paidRub,bonusUse:used,bonusEarned:cashback});
  state.bookings=state.bookings.filter(x=>x.id!==b.id);

  // Реальный денежный доход — только рублёвая часть.
  state.transactions.push({
    id:uid('t'),bookingId:b.id,date:b.date,type:'income',
    title:`${car.name} · завершённый визит`,amount:paidRub
  });

  state.adminNotifications.unshift({
    id:uid('n'),type:'completed',clientId:c.id,title:'Визит завершён',
    text:`${c.name} · ${car.name} · ${money(b.total)} · +${cashback} T`,
    date:new Date().toISOString(),read:false
  });

  save();
  openSheet(`
    <div class="sheet-head"><h3>ВИЗИТ ЗАВЕРШЁН</h3><button class="sheet-close" id="closeSheet">×</button></div>
    <div class="kv" style="margin-top:14px">
      <div class="kv-row"><span>Клиент</span><span>${c.name}</span></div>
      <div class="kv-row"><span>Автомобиль</span><span>${car.name}</span></div>
      <div class="kv-row"><span>Оплачено рублями</span><span>${money(paidRub)}</span></div>
      <div class="kv-row"><span>Списано T-Бонусов</span><span>${new Intl.NumberFormat('ru-RU').format(used)} T</span></div>
      <div class="kv-row"><span>Начислено 5%</span><span>+${new Intl.NumberFormat('ru-RU').format(cashback)} T</span></div>
      <div class="kv-row"><span>Баланс клиента</span><span>${new Intl.NumberFormat('ru-RU').format(ensureWallet(c).balance)} T</span></div>
    </div>
    <button class="action primary" id="finishToHome">ГОТОВО</button>
  `);
  document.getElementById('closeSheet').addEventListener('click',()=>{closeSheet();go('home',{},false)});
  document.getElementById('finishToHome').addEventListener('click',()=>{closeSheet();go('home',{},false)});
}

function deleteClientCar(c,car){
  const active=state.bookings.filter(b=>b.clientId===c.id && b.carId===car.id);
  if(active.length){
    openSheet(`
      <div class="sheet-head">
        <h3>АВТОМОБИЛЬ НЕЛЬЗЯ УДАЛИТЬ</h3>
        <button class="sheet-close" id="closeSheet">×</button>
      </div>
      <div class="birthday-card">

        <p>На этот автомобиль есть ${active.length} активн${active.length===1?'ая запись':'ые записи'}. Сначала отмените или завершите ${active.length===1?'её':'их'}, чтобы не оставить запись без автомобиля.</p>
      </div>
      <button class="action primary" id="closeDeleteBlocked">ПОНЯЛ</button>
    `);
    document.getElementById('closeSheet').addEventListener('click',closeSheet);
    document.getElementById('closeDeleteBlocked').addEventListener('click',closeSheet);
    return;
  }

  openSheet(`
    <div class="sheet-head">
      <h3>УДАЛИТЬ АВТОМОБИЛЬ?</h3>
      <button class="sheet-close" id="closeSheet">×</button>
    </div>
    <div class="birthday-card">
      <strong>${car.name} · ${car.plate}</strong>
      <p>Автомобиль исчезнет из гаража клиента. История уже завершённых визитов останется в профиле и статистике T-CITY.</p>
    </div>
    <button class="action danger" id="confirmDeleteCar">УДАЛИТЬ АВТОМОБИЛЬ</button>
    <button class="action" id="cancelDeleteCar">ОСТАВИТЬ</button>
  `);

  document.getElementById('closeSheet').addEventListener('click',closeSheet);
  document.getElementById('cancelDeleteCar').addEventListener('click',closeSheet);
  document.getElementById('confirmDeleteCar').addEventListener('click',()=>{
    c.cars=(c.cars||[]).filter(x=>x.id!==car.id);

    // Remove stale service reminders specifically tied to this car.
    const removedReminderIds=(c.serviceReminders||[])
      .filter(r=>r.carId===car.id)
      .map(r=>r.id);

    c.serviceReminders=(c.serviceReminders||[]).filter(r=>r.carId!==car.id);

    if(removedReminderIds.length){
      state.adminNotifications=state.adminNotifications.filter(
        n=>!removedReminderIds.includes(n.reminderId)
      );
    }

    state.adminNotifications.unshift({
      id:uid('n'),
      type:'car',
      clientId:c.id,
      title:'Автомобиль удалён',
      text:`${c.name} · ${car.name} · ${car.plate}`,
      date:new Date().toISOString(),
      read:true
    });

    save();
    closeSheet();
    go('client',{id:c.id,tab:'cars'},false);
  });
}

    <div class="section-title" style="margin-top:18px">УВЕДОМЛЕНИЯ КЛИЕНТУ</div>
    ${(c.notifications||[]).length?`<div class="notice-list">${c.notifications.map(n=>`<div class="notice-row"><div class="notice-title">${n.title}</div><div class="notice-meta">${fmtDate(n.date)}<br>${n.text}</div></div>`).join('')}</div>`:'<div class="empty">История уведомлений пуста.</div>'}
    <div class="section-title" style="margin-top:22px">ПОДДЕРЖКА</div>
    ${chats.length?`<div class="chat-list">${chats.map(ch=>`<button class="chat-row" data-open-chat="${ch.id}"><div class="chat-row-top"><strong>Диалог с T-CITY</strong><span class="arrow">→</span></div><div class="chat-meta">${ch.messages.length} сообщений</div></button>`).join('')}</div>`:'<div class="empty">Обращений в поддержку пока нет.</div>'}
  `;
  box.querySelectorAll('[data-open-chat]').forEach(x=>x.addEventListener('click',()=>go('supportChat',{id:x.dataset.openChat})));
}

function renderAddClient(){
  shell('ДОБАВИТЬ КЛИЕНТА',`
    <div class="eyebrow">НОВЫЙ ПРОФИЛЬ</div>
    <h1 class="h1">ДОБАВИТЬ КЛИЕНТА</h1>
    <div class="field"><label>Имя</label><input id="newName"></div>
    <div class="field"><label>Телефон</label><input id="newPhone" placeholder="—"></div>
    <div class="field"><label>Telegram</label><input id="newTelegram" placeholder="—"></div>
    <div class="field"><label>Внутренняя заметка</label><textarea id="newNotes"></textarea></div>
    <button class="action primary" id="createClient">СОЗДАТЬ КЛИЕНТА</button>
  `);
  document.getElementById('createClient').addEventListener('click',()=>{
    const name=document.getElementById('newName').value.trim();
    if(!name)return;
    const c={id:uid('c'),name,phone:document.getElementById('newPhone').value.trim()||'—',telegram:document.getElementById('newTelegram').value.trim()||'—',birthday:'',vip:false,notes:document.getElementById('newNotes').value.trim(),preferences:[],cars:[],visits:[],notifications:[],serviceReminders:[],wallet:{balance:0,earnedTotal:0,spentTotal:0,transactions:[]}};
    state.clients.unshift(c);save();go('client',{id:c.id},false);
  });
}

function renderSupport(){
  const chats=state.supportChats.filter(x=>x.escalated);
  shell('ПОДДЕРЖКА',`
    <div class="eyebrow">ДИАЛОГИ СПЕЦИАЛИСТА</div>
    <h1 class="h1">ПОДДЕРЖКА</h1>
    <p class="lead">Один чат — один клиент. Здесь появляются обращения, которые ассистент передал вам.</p>
    <div class="chat-list" style="margin-top:18px">
      ${chats.map(ch=>{
        const c=client(ch.clientId),last=ch.messages[ch.messages.length-1];
        return `<button class="chat-row ${ch.unread?'':'read'}" data-chat="${ch.id}" style="${ch.unread?'':'opacity:.42'}">
          <div class="chat-row-top"><strong>${c?.name||'Клиент'}</strong>${ch.unread?'<span class="notice-dot"></span>':''}</div>
          <div class="chat-meta">${last?.text||''}</div>
        </button>`;
      }).join('')||'<div class="empty">Нет диалогов, ожидающих внимания.</div>'}
    </div>
  `);
  view.querySelectorAll('[data-chat]').forEach(x=>x.addEventListener('click',()=>go('supportChat',{id:x.dataset.chat})));
}
function renderSupportChat(){
  const ch=state.supportChats.find(x=>x.id===route.params.id);if(!ch){back();return}
  const c=client(ch.clientId);ch.unread=false;save();
  shell(c?.name||'ПОДДЕРЖКА',`
    <div class="eyebrow">ОТВЕТ ОТ ИМЕНИ T-CITY</div>
    <h1 class="h1">${c?.name||'КЛИЕНТ'}</h1>
    <p class="lead">${c?.phone||'—'}</p>
    <div class="message-list" id="messages">
      ${ch.messages.map(m=>`<div class="msg ${m.side==='client'?'client':'admin'}">${m.text}<span class="msg-time">${m.time||''} · ${m.side==='client'?'КЛИЕНТ':'T-CITY'}</span></div>`).join('')}
    </div>
    <div class="composer"><input id="replyText" placeholder="Ответить от имени T-CITY..."><button id="sendReply">↑</button></div>
  `);
  document.getElementById('sendReply').addEventListener('click',()=>{
    const inp=document.getElementById('replyText'),text=inp.value.trim();if(!text)return;
    ch.messages.push({side:'admin',text,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});
    save();renderSupportChat();
  });
}

function renderMailing(){
  const preset=route.params.clientId||'';
  const presetTitle=route.params.title||'';
  const presetText=route.params.text||'';
  let mode=preset?'one':'all';
  shell('РАССЫЛКА',`
    <div class="eyebrow">УВЕДОМЛЕНИЯ КЛИЕНТАМ</div>
    <h1 class="h1">РАССЫЛКА</h1>
    <div class="recipient-mode"><button data-mode="all" class="${mode==='all'?'active':''}">ВСЕМ</button><button data-mode="one" class="${mode==='one'?'active':''}">ОДНОМУ</button></div>
    <div class="field hidden" id="recipientField"><label>Клиент</label><select id="recipient">${state.clients.map(c=>`<option value="${c.id}" ${c.id===preset?'selected':''}>${c.name}</option>`).join('')}</select></div>
    <div class="field"><label>Заголовок</label><input id="mailTitle" value="${presetTitle}" placeholder="Например: Персональное предложение"></div>
    <div class="field"><label>Текст</label><textarea id="mailText" placeholder="Сообщение клиенту...">${presetText}</textarea></div>
    <div class="preview"><strong id="previewTitle">Предварительный просмотр</strong><p id="previewText">Здесь будет видно сообщение перед отправкой.</p></div>
    <button class="action primary" id="sendMail">ОТПРАВИТЬ</button>
  `);
  const recipientField=document.getElementById('recipientField');
  const updateMode=()=>{
    recipientField.classList.toggle('hidden',mode!=='one');
    document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));
  };
  updateMode();
  document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>{mode=x.dataset.mode;updateMode()}));
  const updatePreview=()=>{
    document.getElementById('previewTitle').textContent=document.getElementById('mailTitle').value.trim()||'Предварительный просмотр';
    document.getElementById('previewText').textContent=document.getElementById('mailText').value.trim()||'Здесь будет видно сообщение перед отправкой.';
  };
  document.getElementById('mailTitle').addEventListener('input',updatePreview);
  document.getElementById('mailText').addEventListener('input',updatePreview);
  document.getElementById('sendMail').addEventListener('click',()=>{
    const title=document.getElementById('mailTitle').value.trim(),text=document.getElementById('mailText').value.trim();
    if(!title||!text)return;
    const targets=mode==='all'?state.clients:[client(document.getElementById('recipient').value)].filter(Boolean);
    targets.forEach(c=>c.notifications.push({date:todayKey(),title,text}));
    state.adminNotifications.unshift({id:uid('n'),type:'mail',title:'Рассылка отправлена',text:mode==='all'?`Получателей: ${targets.length}`:`${targets[0]?.name||''}`,date:new Date().toISOString(),read:true});
    save();alert('Уведомление сохранено в демо-истории клиента.');go('home',{},false);
  });
}

function renderAllTime(){
  const visits=state.clients.flatMap(c=>c.visits||[]);
  const serviced=visits.length;
  const gross=visits.reduce((s,v)=>s+(Number(v.price)||0),0);
  const avg=serviced?Math.round(gross/serviced):0;
  shell('ЗА ВСЁ ВРЕМЯ',`
    <div class="eyebrow">T-CITY · ОБЩИЙ РЕЗУЛЬТАТ</div>
    <h1 class="h1">ЗА ВСЁ ВРЕМЯ</h1>
    <p class="lead">Несколько цифр без перегруза — просто чтобы видеть, как растёт T-CITY.</p>
    <div class="metrics" style="grid-template-columns:1fr 1fr;margin-top:24px">
      <div class="metric"><strong>${serviced}</strong><span>автомобилей обслужено</span></div>
      <div class="metric"><strong>${money(gross)}</strong><span>выручка за всё время</span></div>
    </div>
    <div class="metric" style="margin-top:8px"><strong>${money(avg)}</strong><span>средний чек</span></div>
    <div class="time-source">Показатели строятся из завершённых визитов. Активные записи сюда не попадают.</div>
  `);
}

function renderAccounting(){
  const incomes=state.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expenses=state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const serviced=state.clients.reduce((s,c)=>s+(c.visits||[]).length,0);
  const booked=state.bookings.length;
  const upcoming=state.bookings.filter(b=>b.status!=='ready').length;
  shell('УЧЁТ',`
    <div class="eyebrow">ФИНАНСЫ И СТАТИСТИКА</div>
    <h1 class="h1">УЧЁТ</h1>
    <div class="metrics">
      <div class="metric"><strong>${money(incomes)}</strong><span>доходы</span></div>
      <div class="metric"><strong>${money(expenses)}</strong><span>расходы</span></div>
      <div class="metric"><strong>${money(incomes-expenses)}</strong><span>результат</span></div>
      <div class="metric"><strong>${serviced}</strong><span>машин обслужено</span></div>
      <div class="metric"><strong>${booked}</strong><span>записано</span></div>
      <div class="metric"><strong>${upcoming}</strong><span>предстоит</span></div>
    </div>
    <div class="inline2">
      <button class="action" id="addIncome">+ ДОХОД</button>
      <button class="action" id="addExpense">+ РАСХОД</button>
    </div>
    <div class="section-title" style="margin-top:22px">ОПЕРАЦИИ</div>
    <div class="transaction-list">${[...state.transactions].reverse().map(t=>`
      <div class="transaction-row">
        <span><strong style="font-size:11px;font-weight:400">${t.title}</strong><span class="transaction-meta">${fmtDate(t.date)} · ${t.type==='income'?'доход':'расход'}</span></span>
        <span class="transaction-amount ${t.type==='income'?'money-positive':'money-negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span>
      </div>`).join('')}</div>
  `);
  document.getElementById('addIncome').addEventListener('click',()=>openTransaction('income'));
  document.getElementById('addExpense').addEventListener('click',()=>openTransaction('expense'));
}
function openTransaction(type){
  openSheet(`
    <div class="sheet-head"><h3>${type==='income'?'ДОБАВИТЬ ДОХОД':'ДОБАВИТЬ РАСХОД'}</h3><button class="sheet-close" id="closeSheet">×</button></div>
    <div class="field"><label>Описание</label><input id="trTitle"></div>
    <div class="field"><label>Сумма</label><input type="number" min="0" id="trAmount"></div>
    <div class="field"><label>Дата</label><input type="date" id="trDate" value="${todayKey()}"></div>
    <button class="action primary" id="saveTransaction">СОХРАНИТЬ</button>
  `);
  document.getElementById('closeSheet').addEventListener('click',closeSheet);
  document.getElementById('saveTransaction').addEventListener('click',()=>{
    const amount=Number(document.getElementById('trAmount').value),title=document.getElementById('trTitle').value.trim();
    if(!amount||!title)return;
    state.transactions.push({id:uid('t'),date:document.getElementById('trDate').value,type,title,amount});
    save();closeSheet();renderAccounting();
  });
}

function renderBirthdayComposer(){
  const c=client(route.params.clientId);
  if(!c){back();return}
  const first=(c.name||'').split(/\s+/)[0]||'';
  const defaultText=`${first}, поздравляем вас с днём рождения! Команда T-CITY желает вам отличного настроения и приятных событий. Спасибо, что вы с нами.`;
  shell('ДЕНЬ РОЖДЕНИЯ',`
    <div class="eyebrow">ПЕРСОНАЛЬНОЕ ПОЗДРАВЛЕНИЕ</div>
    <h1 class="h1">${c.name}</h1>
    <div class="birthday-card">
      <strong>${c.birthday?`День рождения · ${c.birthday.split('-').slice(1).reverse().join('.')}`:'Дата рождения не указана'}</strong>
      <p>Текст можно изменить перед отправкой. Подарок и T-Бонусы задаёте вы лично.</p>
    </div>
    <div class="field"><label>Текст поздравления</label><textarea id="birthdayText">${defaultText}</textarea></div>
    <div class="field"><label>Подарок / бесплатная услуга / скидка</label><input id="birthdayGift" placeholder="Например: бесплатная полировка фар"></div>
    <div class="field"><label>T-Бонусы в подарок</label><input type="number" min="0" id="birthdayBonus" placeholder="Например: 5000"></div>
    <button class="action primary" id="sendBirthday">ОТПРАВИТЬ КЛИЕНТУ</button>
  `);
  document.getElementById('sendBirthday').addEventListener('click',()=>{
    const text=document.getElementById('birthdayText').value.trim();
    const gift=document.getElementById('birthdayGift').value.trim();
    const bonus=Math.max(0,Math.round(Number(document.getElementById('birthdayBonus').value)||0));
    if(!text)return;

    if(bonus)walletCredit(c,bonus,'Подарок на день рождения');
    const full=[text,gift?`Подарок от T-CITY: ${gift}.`:'',bonus?`На ваш счёт начислено ${new Intl.NumberFormat('ru-RU').format(bonus)} T-Бонусов.`:''].filter(Boolean).join('\\n\\n');
    c.notifications.push({date:todayKey(),title:'С днём рождения!',text:full,type:'birthday',gift,bonus});
    state.adminNotifications.filter(n=>n.type==='birthday'&&n.clientId===c.id).forEach(n=>n.read=true);
    save();
    alert(`Поздравление сохранено в демо-уведомлениях ${c.name}.`);
    go('client',{id:c.id,tab:'history'},false);
  });
}

function renderNotifications(){
  shell('УВЕДОМЛЕНИЯ',`
    <div class="eyebrow">ТОЛЬКО ДЛЯ ADMIN</div>
    <h1 class="h1">УВЕДОМЛЕНИЯ</h1>
    <div class="toolbar">
      <button class="action small" id="markAll">ПРОЧИТАТЬ ВСЕ</button>
      <button class="action small danger" id="clearNotices">ОЧИСТИТЬ ИСТОРИЮ</button>
    </div>
    <div class="notice-list">
      ${state.adminNotifications.map(n=>`<button class="notice-row ${n.read?'read':''}" data-notice="${n.id}">
        <div class="notice-row-top"><span><span class="notice-title">${n.title}</span><span class="notice-meta">${n.text}<br>${new Date(n.date).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></span><span class="notice-dot"></span></div>
      </button>`).join('')||'<div class="empty">История уведомлений пуста.</div>'}
    </div>
  `);
  view.querySelectorAll('[data-notice]').forEach(x=>x.addEventListener('click',()=>{
    const n=state.adminNotifications.find(n=>n.id===x.dataset.notice);
    if(!n)return;
    n.read=true;save();
    if(n.type==='birthday' && n.clientId){go('birthday',{clientId:n.clientId});return}
    if(n.type==='service' && n.clientId){
      const c=client(n.clientId);
      go('mailing',{
        clientId:n.clientId,reminderId:n.reminderId,
        title:'Напоминание от T-CITY',
        text:n.text.replace(`${c?.name||''} · `,'')
      });
      return;
    }
    renderNotifications();
  }));
  document.getElementById('markAll').addEventListener('click',()=>{state.adminNotifications.forEach(n=>n.read=true);save();renderNotifications()});
  document.getElementById('clearNotices').addEventListener('click',()=>{if(confirm('Очистить историю уведомлений только в ADMIN?')){state.adminNotifications=[];save();renderNotifications()}});
}

generateScheduledAlerts();
updateClock();
setInterval(updateClock,1000);
updateBell();
render();
</script>
